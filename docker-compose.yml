services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-internagent}
      POSTGRES_USER: ${POSTGRES_USER:-internagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./api
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://internagent:local-development-only@db:5432/internagent}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY to a strong secret before starting InternAgent}
    depends_on:
      db: { condition: service_healthy }
  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://internagent:local-development-only@db:5432/internagent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-clerk}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: '["http://localhost:3000"]'
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY to a strong secret before starting InternAgent}
      PRIVATE_RESUME_STORAGE_PATH: ${PRIVATE_RESUME_STORAGE_PATH:-/var/lib/internagent/resumes}
    ports: ["8000:8000"]
    volumes: ["resume-storage:/var/lib/internagent/resumes"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  worker:
    build: ./api
    command: celery -A app.scheduler.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://internagent:local-development-only@db:5432/internagent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY to a strong secret before starting InternAgent}
      PRIVATE_RESUME_STORAGE_PATH: ${PRIVATE_RESUME_STORAGE_PATH:-/var/lib/internagent/resumes}
    volumes: ["resume-storage:/var/lib/internagent/resumes"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      INTERNAGENT_API_URL: http://api:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  redis-data:
  resume-storage:
