# Standalone Neon development stack; do not combine with docker-compose.yml.
x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL:?Set the Neon pooled DATABASE_URL}
  DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:?Set the Neon direct migration URL}
  APP_ENVIRONMENT: development
  AUTH_PROVIDER: clerk
  CLERK_ISSUER: ${CLERK_ISSUER:-}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
  CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
  CLERK_AUTHORIZED_PARTIES: '["http://localhost:3000"]'
  ALLOWED_ORIGINS: '["http://localhost:3000"]'
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set a strong encryption key}
  PRIVATE_RESUME_STORAGE_PATH: /var/lib/internagent/resumes
  REDIS_URL: redis://redis:6379/0
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./api
    command: alembic upgrade head
    environment: *api-environment
  api:
    build: ./api
    environment: *api-environment
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["resume-storage:/var/lib/internagent/resumes"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    build: ./api
    command: celery -A app.scheduler.celery_app worker --loglevel=info
    environment: *api-environment
    volumes: ["resume-storage:/var/lib/internagent/resumes"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      INTERNAGENT_API_URL: http://api:8000/api/v1
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  resume-storage:
